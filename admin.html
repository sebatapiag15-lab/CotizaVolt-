<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin CotizaVolt</title><style>body{background:#0B0F1A;color:#fff;font-family:system-ui;padding:20px}.box{background:#161D2E;padding:20px;border-radius:16px;max-width:400px;margin:auto}input,select{width:100%;padding:14px;border-radius:10px;border:1px solid #334155;background:#0B0F1A;color:#fff;margin:8px 0}.btn{width:100%;padding:16px;background:#FACC15;color:#000;border:none;border-radius:12px;font-weight:900;margin-top:10px;cursor:pointer}.result{background:#0B0F1A;border:1px dashed #FACC15;border-radius:12px;padding:12px;margin-top:16px;word-break:break-all;font-size:13px}</style></head><body><div class="box"><h2>⚡ Panel Admin</h2><p style="color:#94a3b8;font-size:13px">RUT: 23.019.823-3 - 9 68034480</p><label>Nombre cliente</label><input id="nombre" placeholder="Juan Pérez"><label>WhatsApp cliente</label><input id="wsp" placeholder="56912345678"><label>Plan</label><select id="dias"><option value="15">15 días - $7.990</option><option value="30">30 días - $14.990</option></select><button class="btn" onclick="generar()">Generar Link</button><div id="res" class="result" style="display:none"></div><button class="btn" style="background:#1e293b;color:#fff;display:none" id="btnWsp" onclick="enviarWsp()">Enviar por WhatsApp</button></div><script>let linkFinal="";function generar(){const dias=parseInt(document.getElementById('dias').value);const venc=new Date();venc.setDate(venc.getDate()+dias);const code=btoa(`${venc.toISOString()}|${dias}|23.019.823-3`);const base=location.href.replace('admin.html','index.html');linkFinal=`${base}?activate=${code}`;document.getElementById('res').style.display='block';document.getElementById('res').innerHTML=`✅ ${dias} días<br><br>${linkFinal}<br><br>Vence: ${venc.toLocaleDateString('es-CL')}`;document.getElementById('btnWsp').style.display='block'}function enviarWsp(){const wsp=document.getElementById('wsp').value;const msg=`Hola! ⚡ Tu CotizaVolt PRO listo: ${linkFinal}`;window.open(`https://wa.me/${wsp}?text=${encodeURIComponent(msg)}`,'_blank')}</script></body></html>
